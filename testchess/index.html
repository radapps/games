<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Fairy Stockfish Board</title>

<meta name="viewport" content="width=device-width,initial-scale=1">

<style>

body{
font-family:sans-serif;
text-align:center;
background:#222;
color:white;
margin:0;
}

#board{
width:95vw;
max-width:520px;
margin:auto;
display:grid;
grid-template-columns:repeat(8,1fr);
border:4px solid #444;
}

.square{
aspect-ratio:1;
display:flex;
align-items:center;
justify-content:center;
font-size:32px;
user-select:none;
}

.light{background:#eee;color:black;}
.dark{background:#777;color:black;}

.selected{
outline:4px solid red;
}

.controls{
margin:10px;
}

input{
width:90%;
font-size:14px;
}

button{
font-size:16px;
margin:4px;
padding:8px;
}

</style>
</head>

<body>

<h2>Fairy Stockfish Board</h2>

<div id="board"></div>

<div class="controls">

<input id="fenInput" placeholder="Paste FEN here">

<br>

<button onclick="loadFEN()">Load FEN</button>
<button onclick="engineMove()">Engine Move</button>
<button onclick="flipBoard()">Flip</button>

<br>

<input id="customPiece" placeholder="Custom piece symbol">

<button onclick="placeCustom()">Place Piece</button>

</div>

<script src="fairy-stockfish.js"></script>

<script>

let board = document.getElementById("board")

let squares = []
let position = []
let selected = null
let flipped=false

let pieceMap={
p:"♟",
r:"♜",
n:"♞",
b:"♝",
q:"♛",
k:"♚",
P:"♙",
R:"♖",
N:"♘",
B:"♗",
Q:"♕",
K:"♔"
}

function createBoard(){

board.innerHTML=""
squares=[]

for(let r=0;r<8;r++){
for(let c=0;c<8;c++){

let sq=document.createElement("div")

sq.className="square "+((r+c)%2?"dark":"light")

sq.dataset.index=r*8+c

sq.onclick=()=>clickSquare(r*8+c)

board.appendChild(sq)

squares.push(sq)

}}

}

function draw(){

for(let i=0;i<64;i++){

let piece=position[i]||""

let symbol=pieceMap[piece]||piece

squares[i].innerText=symbol

squares[i].classList.remove("selected")

}

if(selected!=null)
squares[selected].classList.add("selected")

}

function clickSquare(i){

if(selected==null){

selected=i

}else{

position[i]=position[selected]
position[selected]=""

selected=null

}

draw()

}

function loadFEN(){

let fen=document.getElementById("fenInput").value

let rows=fen.split(" ")[0].split("/")

position=[]

for(let r=0;r<8;r++){

let row=rows[r]

for(let ch of row){

if(Number(ch)){

for(let i=0;i<ch;i++)
position.push("")

}else{

position.push(ch)

}

}}

draw()

}

function boardToFEN(){

let fen=""
for(let r=0;r<8;r++){

let empty=0

for(let c=0;c<8;c++){

let piece=position[r*8+c]

if(piece==""){

empty++

}else{

if(empty){
fen+=empty
empty=0
}

fen+=piece
}

}

if(empty) fen+=empty

if(r<7) fen+="/"

}

return fen+" w - - 0 1"

}

function placeCustom(){

let piece=document.getElementById("customPiece").value

if(selected!=null){

position[selected]=piece

selected=null

draw()

}

}

function flipBoard(){

position.reverse()

draw()

}

createBoard()

position=new Array(64).fill("")

loadFENFromStart()

function loadFENFromStart(){

document.getElementById("fenInput").value=
"rn bqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w"

loadFEN()

}

let engine = new Worker("fairy-stockfish.js")

engine.onmessage=function(e){

let line=e.data

if(line.startsWith("bestmove")){

let move=line.split(" ")[1]

applyMove(move)

}

}

function engineMove(){

let fen=boardToFEN()

engine.postMessage("uci")
engine.postMessage("isready")
engine.postMessage("position fen "+fen)
engine.postMessage("go depth 10")

}

function applyMove(move){

let from=move.slice(0,2)
let to=move.slice(2,4)

let fromIndex=coordToIndex(from)
let toIndex=coordToIndex(to)

position[toIndex]=position[fromIndex]
position[fromIndex]=""

draw()

}

function coordToIndex(c){

let file=c.charCodeAt(0)-97
let rank=8-Number(c[1])

return rank*8+file

}

</script>

</body>
</html>
