<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fairy Chess</title>

<style>

body{
font-family:Arial;
text-align:center;
background:#222;
color:white;
}

#board{
display:grid;
grid-template-columns:repeat(8,1fr);
width:95vw;
max-width:500px;
margin:auto;
}

.square{
aspect-ratio:1;
display:flex;
align-items:center;
justify-content:center;
font-size:40px;
user-select:none;
}

.light{background:#f0d9b5}
.dark{background:#b58863}

.controls{
margin-top:10px;
}

input{
width:90%;
padding:8px;
}

button{
padding:8px;
margin:4px;
}

</style>

</head>

<body>

<h2>Fairy Chess</h2>

<div id="board"></div>

<div class="controls">

<input id="fenInput">

<br>

<button onclick="loadFENFromInput()">Load FEN</button>
<button onclick="engineMove()">Engine Move</button>

</div>

<script src="fairy-stockfish.js"></script>

<script>

/* =============================
BOARD STATE
============================= */

let board=[]
let selected=null
let sideToMove="w"

const boardElement=document.getElementById("board")

/* =============================
PIECE DEFINITIONS
EDIT THIS TO ADD FAIRY PIECES
============================= */

const pieces={

p:"♟",
r:"♜",
n:"♞",
b:"♝",
q:"♛",
k:"♚",

P:"♙",
R:"♖",
N:"♘",
B:"♗",
Q:"♕",
K:"♔",

}

/* Example fairy piece
pieces["a"]="🜁"
pieces["A"]="🜁"
*/

/* =============================
CREATE BOARD
============================= */

function createBoard(){

boardElement.innerHTML=""

for(let r=0;r<8;r++){

for(let c=0;c<8;c++){

let sq=document.createElement("div")

sq.className="square "+((r+c)%2?"dark":"light")

sq.dataset.r=r
sq.dataset.c=c

sq.onclick=clickSquare

boardElement.appendChild(sq)

}

}

}

/* =============================
DRAW BOARD
============================= */

function drawBoard(){

let squares=document.querySelectorAll(".square")

squares.forEach(sq=>{

let r=sq.dataset.r
let c=sq.dataset.c

let piece=board[r][c]

sq.textContent=pieces[piece]||""

})

}

/* =============================
FEN LOADER
============================= */

function loadFEN(fen){

let parts=fen.split(" ")

let rows=parts[0].split("/")

board=[]

for(let r=0;r<8;r++){

let row=[]

for(let char of rows[r]){

if(!isNaN(char)){

for(let i=0;i<parseInt(char);i++)
row.push("")

}
else{

row.push(char)

}

}

board.push(row)

}

sideToMove=parts[1]

drawBoard()

}

/* =============================
INPUT FEN
============================= */

function loadFENFromInput(){

let fen=document.getElementById("fenInput").value

loadFEN(fen)

}

/* =============================
CLICK MOVE SYSTEM
============================= */

function clickSquare(){

let r=this.dataset.r
let c=this.dataset.c

if(selected){

movePiece(selected.r,selected.c,r,c)

selected=null

}
else{

if(board[r][c]!=""){

selected={r:r,c:c}

}

}

}

/* =============================
MOVE PIECE
============================= */

function movePiece(r1,c1,r2,c2){

board[r2][c2]=board[r1][c1]
board[r1][c1]=""

drawBoard()

}

/* =============================
FEN EXPORT
============================= */

function getFEN(){

let fen=""

for(let r=0;r<8;r++){

let empty=0

for(let c=0;c<8;c++){

let piece=board[r][c]

if(piece==""){

empty++

}
else{

if(empty>0){
fen+=empty
empty=0
}

fen+=piece

}

}

if(empty>0) fen+=empty

if(r<7) fen+="/"

}

fen+=" "+sideToMove+" - - 0 1"

return fen

}

/* =============================
ENGINE
============================= */

let engineReady=false

Module["onRuntimeInitialized"]=function(){

engineReady=true

console.log("Engine ready")

}

function engineMove(){

if(!engineReady){
alert("Engine not ready")
return
}

let fen=getFEN()

Module.ccall(
'uci_command',
null,
['string'],
['position fen '+fen]
)

Module.ccall(
'uci_command',
null,
['string'],
['go depth 12']
)

}

/* =============================
ENGINE OUTPUT
============================= */

Module.print=function(line){

console.log("ENGINE:",line)

if(line.startsWith("bestmove")){

let move=line.split(" ")[1]

applyEngineMove(move)

}

}

/* =============================
APPLY ENGINE MOVE
============================= */

function applyEngineMove(move){

let c1=move.charCodeAt(0)-97
let r1=8-move[1]

let c2=move.charCodeAt(2)-97
let r2=8-move[3]

movePiece(r1,c1,r2,c2)

}

/* =============================
INITIALIZE
============================= */

createBoard()

let startFEN=
"rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1"

document.getElementById("fenInput").value=startFEN

loadFEN(startFEN)

</script>

</body>
</html>
