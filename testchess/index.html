<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fairy Chess</title>

<style>

body{
font-family:Arial;
text-align:center;
background:#222;
color:white;
}

#board{
display:grid;
grid-template-columns:repeat(8,1fr);
width:95vw;
max-width:500px;
margin:auto;
}

.square{
aspect-ratio:1;
display:flex;
align-items:center;
justify-content:center;
font-size:40px;
user-select:none;
}

.light{background:#f0d9b5}
.dark{background:#b58863}

.controls{
margin-top:10px;
}

input{
width:90%;
padding:8px;
}

button{
padding:8px;
margin:4px;
}

</style>

</head>

<body>

<h2>Fairy Chess</h2>

<div id="board"></div>

<div class="controls">

<input id="fenInput">

<br>

<button onclick="loadFENFromInput()">Load FEN</button>
<button onclick="engineMove()">Engine Move</button>

</div>

<script type="module">

import StockfishFactory from "./fairy-stockfish.js";

let engine = null;
let engineReady = false;

/* =========================
INITIALIZE ENGINE
========================= */

async function initEngine(){

    engine = await StockfishFactory();

    engineReady = true;

    console.log("Fairy-Stockfish loaded");

    engine.ccall(
        "uci_command",
        null,
        ["string"],
        ["uci"]
    );

}

initEngine();

/* =========================
SEND COMMAND
========================= */

function send(cmd){

    if(!engineReady){
        console.log("Engine not ready");
        return;
    }

    engine.ccall(
        "uci_command",
        null,
        ["string"],
        [cmd]
    );

}

/* =========================
ENGINE MOVE
========================= */

window.engineMove = function(){

    if(!engineReady) return;

    let fen = getFEN();

    send("position fen " + fen);
    send("go depth 12");

}

/* =========================
ENGINE OUTPUT
========================= */

enginePrint = function(line){

    console.log("ENGINE:",line);

    if(line.startsWith("bestmove")){

        let move=line.split(" ")[1];

        applyEngineMove(move);

    }

};

</script>
  
</body>
</html>
