        // Start new game with color selection
        function startNewGame() {
            document.getElementById('colorModal').classList.add('active');
        }
        
        // Choose color and start game
        function chooseColor(color) {
            playerColor = color;
            boardFlipped = (color === 'b');
            document.getElementById('colorModal').classList.remove('active');
            initGame();
        }
        
        // Render chessboard
        function renderBoard() {
            const board = document.getElementById('chessboard');
            board.innerHTML = '';
            
            const position = game.board();
            
            // Determine row order based on player color - player's color always on bottom
            const rows = boardFlipped ? [7, 6, 5, 4, 3, 2, 1, 0] : [0, 1, 2, 3, 4, 5, 6, 7];
            const cols = boardFlipped ? [7, 6, 5, 4, 3, 2, 1, 0] : [0, 1, 2, 3, 4, 5, 6, 7];
            
            rows.forEach((row) => {
                cols.forEach((col) => {
                    const square = document.createElement('div');
                    const squareColor = (row + col) % 2 === 0 ? 'light' : 'dark';
                    square.className = `square ${squareColor}`;
                    
                    const squareNotation = String.fromCharCode(97 + col) + (8 - row);
                    square.dataset.square = squareNotation;
                    
                    const piece = position[row][col];
                    if (piece) {
                        const img = document.createElement('img');
                        img.src = getPieceImage(piece);
                        img.alt = piece.type;
                        square.appendChild(img);
                    }
                    
                    square.addEventListener('click', () => handleSquareClick(squareNotation));
                    
                    board.appendChild(square);
                });
            });
        }
        
        // Get piece image path
        function getPieceImage(piece) {
            const pieceNames = {
                'p': 'pawn',
                'r': 'rook',
                'n': 'knight',
                'b': 'bishop',
                'q': 'queen',
                'k': 'king',
                'a': 'amazon'
            };
            const pieceName = pieceNames[piece.type];
            const color = piece.color === 'w' ? 'white' : 'black';
            return `assets/chess/${pieceName}_${color}.png`;
        }
        
        // Handle square click
        function handleSquareClick(square) {
            if (game.game_over()) return;
            
            // Handle card piece selection modes first (before turn check)
            // These modes should work even if game.turn() has switched
            if (anathemaMode) {
                handleAnathemaSelection(square);
                return;
            }
            
            if (blackWidowMode) {
                handleBlackWidowSelection(square);
                return;
            }
            
            if (battlefieldPromotionMode) {
                handleBattlefieldPromotionSelection(square);
                return;
            }
            
            if (betrayalMode) {
                handleBetrayalSelection(square);
                return;
            }
            
            if (blindFateMode) {
                handleBlindFatePlacement(square);
                return;
            }
            
            // Normal move handling - check if it's player's turn
            if (game.turn() !== playerColor) return;
            
            // If no square selected, select this square if it has a piece
            if (!selectedSquare) {
                const piece = game.get(square);
                if (piece && piece.color === game.turn()) {
                    selectedSquare = square;
                    highlightSquare(square);
                    showValidMoves(square);
                }
            } else {
                // Check if this is a pawn promotion move
                const piece = game.get(selectedSquare);
                const isPawnPromotion = piece && piece.type === 'p' &&
                    ((piece.color === 'w' && square[1] === '8') ||
                     (piece.color === 'b' && square[1] === '1'));
                
                if (isPawnPromotion) {
                    // Show promotion modal
                    showPromotionModal(selectedSquare, square);
                } else {
                    // Try to make a normal move
                    attemptMove(selectedSquare, square);
                }
            }
        }
        
        // Attempt to make a move (extracted for reuse)
        function attemptMove(from, to, promotion = null) {
            const piece = game.get(from);
            
            // Handle amazon moves specially (knight OR bishop movement)
            if (piece && piece.type === 'a') {
                if (isValidAmazonMove(from, to)) {
                    // Check if destination has opponent piece (capture)
                    const captured = game.get(to);
                    
                    // Make the move manually
                    game.remove(from);
                    game.put(piece, to);
                    
                    // Track captured piece
                    if (captured) {
                        addCapturedPiece(captured.type, captured.color);
                    }
                    
                    // Update game state
                    hasMoved = true;
                    currentGamePhase = 'AFTERMOVE';
                    clearHighlights();
                    selectedSquare = null;
                    renderBoard();
                    updateGameInfo();
                    updateEndTurnButton();
                    updateCardPlayability();
                    
                    return true;
                } else {
                    // Invalid amazon move
                    clearHighlights();
                    selectedSquare = null;
                    handleSquareClick(to);
                    return false;
                }
            }
            
            // Normal chess.js move handling
            const moveOptions = { from: from, to: to };
            if (promotion) {
                moveOptions.promotion = promotion;
            }
            
            const move = game.move(moveOptions);
            
            if (move) {
                // Valid move made
                hasMoved = true;
                currentGamePhase = 'AFTERMOVE'; // Update game phase
                
                if (move.captured) {
                    addCapturedPiece(move.captured, move.color === 'w' ? 'b' : 'w');
                }
                clearHighlights();
                selectedSquare = null;
                renderBoard();
                updateGameInfo();
                updateEndTurnButton();
                updateCardPlayability(); // Update which cards can be played
                
                return true;
            } else {
                // Invalid move, try selecting new square
                clearHighlights();
                selectedSquare = null;
                handleSquareClick(to);
                return false;
            }
        }
        
        // Check if amazon move is valid (knight OR bishop)
        function isValidAmazonMove(from, to) {
            const fromFile = from.charCodeAt(0) - 97;
            const fromRank = parseInt(from[1]) - 1;
            const toFile = to.charCodeAt(0) - 97;
            const toRank = parseInt(to[1]) - 1;
            
            const fileDiff = Math.abs(toFile - fromFile);
            const rankDiff = Math.abs(toRank - fromRank);
            
            // Knight move: L-shape (2,1) or (1,2)
            const isKnightMove = (fileDiff === 2 && rankDiff === 1) || (fileDiff === 1 && rankDiff === 2);
            
            // Bishop move: diagonal
            const isBishopMove = fileDiff === rankDiff && fileDiff > 0;
            
            if (!isKnightMove && !isBishopMove) return false;
            
            // Check destination square
            const destination = game.get(to);
            const piece = game.get(from);
            
            // Can't capture own piece
            if (destination && destination.color === piece.color) return false;
            
            // If bishop move, check path is clear
            if (isBishopMove) {
                const fileDir = Math.sign(toFile - fromFile);
                const rankDir = Math.sign(toRank - fromRank);
                
                let checkFile = fromFile + fileDir;
                let checkRank = fromRank + rankDir;
                
                while (checkFile !== toFile || checkRank !== toRank) {
                    const checkSquare = String.fromCharCode(97 + checkFile) + (checkRank + 1);
                    if (game.get(checkSquare)) return false; // Path blocked
                    
                    checkFile += fileDir;
                    checkRank += rankDir;
                }
            }
            
            return true;
        }
        
        // Pawn promotion modal
        let pendingPromotionMove = null;
        let isBattlefieldPromotion = false;
        
        function showPromotionModal(from, to, hideQueen = false) {
            pendingPromotionMove = { from, to };
            isBattlefieldPromotion = hideQueen;
            const modal = document.getElementById('promotionModal');
            
            // Set piece icons based on player color
            const pieceColor = game.turn();
            const pieces = {
                'q': pieceColor === 'w' ? '♕' : '♛',
                'r': pieceColor === 'w' ? '♖' : '♜',
                'b': pieceColor === 'w' ? '♗' : '♝',
                'n': pieceColor === 'w' ? '♘' : '♞'
            };
            
            document.getElementById('promoteQueen').textContent = pieces['q'];
            document.getElementById('promoteRook').textContent = pieces['r'];
            document.getElementById('promoteBishop').textContent = pieces['b'];
            document.getElementById('promoteKnight').textContent = pieces['n'];
            
            // Show/hide queen option
            if (hideQueen) {
                document.getElementById('promoteQueen').style.display = 'none';
            } else {
                document.getElementById('promoteQueen').style.display = 'flex';
            }
            
            modal.classList.add('active');
        }
        
        function handlePromotion(pieceType) {
            if (!pendingPromotionMove) return;
            
            const { from, to } = pendingPromotionMove;
            
            if (isBattlefieldPromotion) {
                // Battlefield Promotion: replace pawn directly without moving
                const pawnColor = game.get(from).color;
                game.remove(from);
                game.put({ type: pieceType, color: pawnColor }, from);
                
                // Update the FEN to persist the change
                const currentFen = game.fen();
                game.load(currentFen);
                
                renderBoard();
                updateGameInfo('Battlefield Promotion: Pawn promoted to ' + 
                              (pieceType === 'r' ? 'Rook' : pieceType === 'b' ? 'Bishop' : 'Knight') + '!');
            } else {
                // Normal pawn promotion via move
                attemptMove(from, to, pieceType);
            }
            
            // Close modal
            document.getElementById('promotionModal').classList.remove('active');
            pendingPromotionMove = null;
            isBattlefieldPromotion = false;
        }
        
        // Highlight selected square
        function highlightSquare(square) {
            const squareElement = document.querySelector(`[data-square="${square}"]`);
            if (squareElement) {
                squareElement.classList.add('selected');
            }
        }
        
        // Show valid moves
        function showValidMoves(square) {
            const piece = game.get(square);
            
            // Handle amazon valid moves
            if (piece && piece.type === 'a') {
                // Show all valid amazon moves
                for (let file = 0; file < 8; file++) {
                    for (let rank = 0; rank < 8; rank++) {
                        const targetSquare = String.fromCharCode(97 + file) + (rank + 1);
                        if (targetSquare !== square && isValidAmazonMove(square, targetSquare)) {
                            const targetElement = document.querySelector(`[data-square="${targetSquare}"]`);
                            if (targetElement) {
                                const destination = game.get(targetSquare);
                                if (destination && destination.color !== piece.color) {
                                    targetElement.classList.add('capture-move');
                                } else if (!destination) {
                                    targetElement.classList.add('valid-move');
                                }
                            }
                        }
                    }
                }
                return;
            }
            
            // Normal chess.js moves
            const moves = game.moves({ square: square, verbose: true });
            moves.forEach(move => {
                const targetSquare = document.querySelector(`[data-square="${move.to}"]`);
                if (targetSquare) {
                    if (move.flags.includes('c') || move.flags.includes('e')) {
                        targetSquare.classList.add('capture-move');
                    } else {
                        targetSquare.classList.add('valid-move');
                    }
                }
            });
        }
        
        // Clear all highlights
        function clearHighlights() {
            document.querySelectorAll('.square').forEach(square => {
                square.classList.remove('selected', 'valid-move', 'capture-move');
            });
        }
        
        // Add captured piece
        function addCapturedPiece(pieceType, color) {
            const capturedContainer = document.getElementById('capturedPieces');
            const pieceElement = document.createElement('div');
            pieceElement.className = 'captured-piece';
            
            const img = document.createElement('img');
            img.src = getPieceImage({ type: pieceType, color: color });
            img.style.width = '100%';
            img.style.height = '100%';
            img.style.objectFit = 'contain';
            pieceElement.appendChild(img);
            
            capturedContainer.appendChild(pieceElement);
            
            // Track captured pieces for cards
            if (color === playerColor) {
                // Player's piece was captured
                if (pieceType === 'p') {
                    capturedPlayerPawns.push(color);
                }
                capturedPlayerPiecesByType[pieceType]++;
                capturedPlayerPiecesArray.push({ type: pieceType, color: color });
            } else {
                // Opponent's piece was captured
                if (pieceType === 'p') {
                    capturedOpponentPawns.push(color);
                }
                capturedOpponentPiecesByType[pieceType]++;
            }
        }
        
        // Render player cards
        function renderPlayerCards() {
            const container = document.getElementById('playerCards');
            container.innerHTML = '';
            
            playerCards.forEach((cardName, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.setAttribute('data-card-index', index);
                
                const img = document.createElement('img');
                img.src = `assets/${cardName}.jpg`;
                img.alt = cardName;
                img.onerror = function() {
                    // Fallback if image doesn't exist
                    this.style.display = 'none';
                    card.textContent = cardName;
                    card.style.fontSize = '0.7rem';
                    card.style.padding = '8px';
                    card.style.display = 'flex';
                    card.style.alignItems = 'center';
                    card.style.justifyContent = 'center';
                    card.style.textAlign = 'center';
                    card.style.color = 'var(--text-primary)';
                };
                
                card.appendChild(img);
                card.addEventListener('click', () => openCardModal(cardName, index));
                container.appendChild(card);
            });
            
            // Update card playability after rendering
            updateCardPlayability();
        }
        
        // Render active cards (persistent effects)
        function renderActiveCards() {
            const container = document.getElementById('activeCards');
            container.innerHTML = '';
            
            activeCards.forEach((cardName) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.style.border = '2px solid var(--accent-gold)';
                card.style.boxShadow = '0 0 15px rgba(212, 175, 55, 0.5)';
                
                const img = document.createElement('img');
                img.src = `assets/${cardName}.jpg`;
                img.alt = cardName;
                img.onerror = function() {
                    this.style.display = 'none';
                    card.textContent = cardName;
                    card.style.fontSize = '0.7rem';
                    card.style.padding = '8px';
                    card.style.display = 'flex';
                    card.style.alignItems = 'center';
                    card.style.justifyContent = 'center';
                    card.style.textAlign = 'center';
                    card.style.color = 'var(--text-primary)';
                };
                
                card.appendChild(img);
                container.appendChild(card);
            });
        }
        
        // Open card modal
        function openCardModal(cardName, cardIndex) {
            currentCardSelected = { name: cardName, index: cardIndex };
            const modal = document.getElementById('cardModal');
            const modalImage = document.getElementById('modalCardImage');
            
            modalImage.src = `assets/${cardName}.jpg`;
            modalImage.alt = cardName;
            modalImage.onerror = function() {
                // Fallback
                this.alt = `${cardName} (Image not found)`;
            };
            
            // Check if card is playable
            const playable = isCardPlayable(cardName);
            
            // Hide play/discard buttons if card was already played/discarded this turn
            if (hasPlayedOrDiscardedCard) {
                document.getElementById('btnPlay').style.display = 'none';
                document.getElementById('btnDiscard').style.display = 'none';
                document.getElementById('btnCancel').textContent = 'Close';
            } else {
                // Show Play button only if card is playable
                document.getElementById('btnPlay').style.display = playable ? 'inline-block' : 'none';
                document.getElementById('btnDiscard').style.display = 'inline-block';
                document.getElementById('btnCancel').textContent = 'Cancel';
            }
            
            modal.classList.add('active');
        }
        
        // Close card modal (restore button states)
        function closeCardModal() {
            document.getElementById('cardModal').classList.remove('active');
            document.getElementById('btnPlay').style.display = 'inline-block';
            document.getElementById('btnDiscard').style.display = 'inline-block';
            document.getElementById('btnCancel').textContent = 'Cancel';
            currentCardSelected = null;
        }
        
        // Play card
        function playCard() {
            if (!currentCardSelected) return;
            if (hasPlayedOrDiscardedCard) {
                alert('You can only play or discard one card per turn!');
                return;
            }
            
            const cardName = currentCardSelected.name;
            
            // Execute card effect if config exists
            const config = cardConfigs[cardName];
            if (config && config.effect) {
                const gameState = getGameState();
                config.effect(gameState);
            }
            
            // Add to discard pile (unless it persists)
            if (!config || !config.effectPersists) {
                discardPile.push(cardName);
            } else {
                // Add to active cards
                activeCards.push(cardName);
            }
            
            // Remove from hand
            playerCards.splice(currentCardSelected.index, 1);
            
            // Mark that a card was played
            hasPlayedOrDiscardedCard = true;
            
            // Update displays
            updateDiscardPile();
            renderPlayerCards();
            renderActiveCards();
            updateEndTurnButton();
            closeCardModal();
        }
        
        // Discard card
        function discardCard() {
            if (!currentCardSelected) return;
            if (hasPlayedOrDiscardedCard) {
                alert('You can only play or discard one card per turn!');
                return;
            }
            
            // Add to discard pile
            discardPile.push(currentCardSelected.name);
            
            // Remove from hand
            playerCards.splice(currentCardSelected.index, 1);
            
            // Mark that a card was discarded
            hasPlayedOrDiscardedCard = true;
            
            // Update displays
            updateDiscardPile();
            renderPlayerCards();
            updateEndTurnButton();
            closeCardModal();
        }
        
        // Draw card with shuffle logic
        function drawCard() {
            // If deck is empty, shuffle discard pile back into deck (except last card)
            if (deck.length === 0 && discardPile.length > 1) {
                console.log('Deck empty! Shuffling discard pile...');
                const lastCard = discardPile.pop(); // Keep last played card
                deck = shuffleArray(discardPile);
                discardPile = [lastCard]; // Put last card back
                updateDiscardPile();
            }
            
            if (deck.length > 0 && playerCards.length < 5) {
                playerCards.push(deck.pop());
                deckCards = deck.length;
                updateDeckCount();
                return true;
            }
            return false;
        }
        
        // End turn
        async function endTurn() {
            // Check active card conditions and remove expired ones
            checkActiveCardConditions();
            
            // Draw cards to fill hand to 5
            while (playerCards.length < 5) {
                if (!drawCard()) {
                    break; // No more cards available
                }
            }
            
            // Reset turn flags
            hasPlayedOrDiscardedCard = false;
            hasMoved = false;
            
            // Update displays
            renderPlayerCards();
            renderActiveCards();
            updateEndTurnButton();
            updateGameInfo();
            
            // Trigger computer's turn
            if (!game.game_over()) {
                await makeComputerMove();
                
                // Check active cards again after computer move
                checkActiveCardConditions();
                
                // Reset game phase to BEFOREMOVE at start of player's turn
                currentGamePhase = 'BEFOREMOVE';
                updateCardPlayability();
            }
        }
        
        // Check if active cards should still be active
        function checkActiveCardConditions() {
            const cardsToRemove = [];
            
            activeCards.forEach(cardName => {
                const config = cardConfigs[cardName];
                if (config && config.continuingEffectCondition) {
                    if (!config.continuingEffectCondition()) {
                        // Effect has expired
                        cardsToRemove.push(cardName);
                        discardPile.push(cardName);
                    }
                }
            });
            
            // Remove expired cards
            cardsToRemove.forEach(cardName => {
                const index = activeCards.indexOf(cardName);
                if (index >= 0) {
                    activeCards.splice(index, 1);
                }
            });
            
            if (cardsToRemove.length > 0) {
                renderActiveCards();
                updateDiscardPile();
            }
        }
        
        // Update END TURN button state
        function updateEndTurnButton() {
            const btn = document.getElementById('endTurnBtn');
            
            // Disable button if game is over
            if (game.in_checkmate() || game.in_draw()) {
                btn.disabled = true;
                btn.classList.remove('active-turn');
                return;
            }
            
            // Can only end turn if moved (includes INSTEADOF card plays)
            if (hasMoved) {
                btn.disabled = false;
                btn.classList.add('active-turn');
            } else {
                btn.disabled = true;
                btn.classList.remove('active-turn');
            }
        }
        
        // Update deck count display
        function updateDeckCount() {
            document.getElementById('deckCount').textContent = deckCards;
            
            // Update deck pile image
            const deckPileElement = document.getElementById('deckPile');
            if (deckCards > 0) {
                // Show card back if deck has cards
                let img = deckPileElement.querySelector('img');
                if (!img) {
                    img = document.createElement('img');
                    img.src = 'assets/cardback.jpg';
                    img.alt = 'Deck';
                    deckPileElement.insertBefore(img, deckPileElement.firstChild);
                }
            } else {
                // Remove image if deck is empty
                const img = deckPileElement.querySelector('img');
                if (img) img.remove();
            }
        }
        
        // Update discard pile display
        function updateDiscardPile() {
            const discardPileElement = document.getElementById('discardPile');
            discardPileElement.innerHTML = '';
            
            if (discardPile.length > 0) {
                const topCard = discardPile[discardPile.length - 1];
                const img = document.createElement('img');
                img.src = `assets/${topCard}.jpg`;
                img.alt = topCard;
                img.onerror = function() {
                    discardPileElement.textContent = topCard;
                    discardPileElement.style.fontSize = '0.8rem';
                    discardPileElement.style.padding = '10px';
                    discardPileElement.style.color = 'var(--text-primary)';
                };
                discardPileElement.appendChild(img);
            }
        }
        
        // View discard pile top card
        function viewDiscardCard() {
            if (discardPile.length === 0) return;
            
            const topCard = discardPile[discardPile.length - 1];
            const modal = document.getElementById('cardModal');
            const modalImage = document.getElementById('modalCardImage');
            
            modalImage.src = `assets/${topCard}.jpg`;
            modalImage.alt = topCard;
            
            // Hide play/discard buttons for viewing
            document.getElementById('btnPlay').style.display = 'none';
            document.getElementById('btnDiscard').style.display = 'none';
            document.getElementById('btnCancel').textContent = 'Close';
            
            modal.classList.add('active');
        }
        
        // Update game info
        function updateGameInfo(customMessage = null) {
            const info = document.getElementById('gameInfo');
            
            // Determine new message
            let newMessage = '';
            if (customMessage) {
                newMessage = customMessage;
            } else if (game.in_checkmate()) {
                newMessage = `Checkmate! ${game.turn() === 'w' ? 'Black' : 'White'} wins!`;
            } else if (game.in_draw()) {
                newMessage = 'Game ended in a draw';
            } else if (game.in_check()) {
                newMessage = `${game.turn() === 'w' ? 'White' : 'Black'} is in check`;
            } else {
                newMessage = `${game.turn() === 'w' ? 'White' : 'Black'} to move`;
            }
            
            // Add flash animation if message changed
            if (info.textContent !== newMessage) {
                info.textContent = newMessage;
                info.classList.remove('flash');
                // Force reflow to restart animation
                void info.offsetWidth;
                info.classList.add('flash');
                
                // Remove flash class after animation completes
                setTimeout(() => {
                    info.classList.remove('flash');
                }, 600);
            }
            
            // Handle checkmate special effects
            if (game.in_checkmate()) {
                startFireworks();
                const btn = document.getElementById('endTurnBtn');
                btn.disabled = true;
                btn.classList.remove('active-turn');
            }
        }
        
        // Fireworks animation
        function startFireworks() {
            const canvas = document.getElementById('fireworksCanvas');
            canvas.style.display = 'block';
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            const fireworks = [];
            const particles = [];
            
            class Firework {
                constructor() {
                    this.x = Math.random() * canvas.width;
                    this.y = canvas.height;
                    this.targetY = Math.random() * canvas.height * 0.5;
                    this.speed = 5;
                    this.exploded = false;
                    this.hue = Math.random() * 360;
                }
                
                update() {
                    if (!this.exploded) {
                        this.y -= this.speed;
                        if (this.y <= this.targetY) {
                            this.explode();
                        }
                    }
                }
                
                draw() {
                    if (!this.exploded) {
                        ctx.beginPath();
                        ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
                        ctx.fillStyle = `hsl(${this.hue}, 100%, 50%)`;
                        ctx.fill();
                    }
                }
                
                explode() {
                    this.exploded = true;
                    for (let i = 0; i < 50; i++) {
                        particles.push(new Particle(this.x, this.y, this.hue));
                    }
                }
            }
            
            class Particle {
                constructor(x, y, hue) {
                    this.x = x;
                    this.y = y;
                    this.hue = hue;
                    this.velocity = {
                        x: (Math.random() - 0.5) * 8,
                        y: (Math.random() - 0.5) * 8
                    };
                    this.alpha = 1;
                    this.decay = Math.random() * 0.02 + 0.01;
                }
                
                update() {
                    this.velocity.y += 0.1;
                    this.x += this.velocity.x;
                    this.y += this.velocity.y;
                    this.alpha -= this.decay;
                }
                
                draw() {
                    ctx.save();
                    ctx.globalAlpha = this.alpha;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, 2, 0, Math.PI * 2);
                    ctx.fillStyle = `hsl(${this.hue}, 100%, 50%)`;
                    ctx.fill();
                    ctx.restore();
                }
            }
            
            function animate() {
                ctx.fillStyle = 'rgba(10, 10, 15, 0.1)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                const elapsed = Date.now() - startTime;
                
                // Launch new fireworks only for the first 4 seconds
                if (elapsed < 4000 && Math.random() < 0.1 && fireworks.length < 3) {
                    fireworks.push(new Firework());
                }
                
                // Update and draw fireworks
                for (let i = fireworks.length - 1; i >= 0; i--) {
                    fireworks[i].update();
                    fireworks[i].draw();
                    if (fireworks[i].exploded) {
                        fireworks.splice(i, 1);
                    }
                }
                
                // Update and draw particles
                for (let i = particles.length - 1; i >= 0; i--) {
                    particles[i].update();
                    particles[i].draw();
                    if (particles[i].alpha <= 0) {
                        particles.splice(i, 1);
                    }
                }
                
                // Continue animating if under 6 seconds OR if there are still particles/fireworks
                if (elapsed < 6000 || fireworks.length > 0 || particles.length > 0) {
                    requestAnimationFrame(animate);
                } else {
                    canvas.style.display = 'none';
                }
            }
            
            const startTime = Date.now();
            animate();
        }
        
        // Modal event listeners
        document.getElementById('btnPlay').addEventListener('click', playCard);
        document.getElementById('btnDiscard').addEventListener('click', discardCard);
        document.getElementById('btnCancel').addEventListener('click', closeCardModal);
        
        // Color selection event listeners
        document.getElementById('playWhite').addEventListener('click', () => chooseColor('w'));
        document.getElementById('playBlack').addEventListener('click', () => chooseColor('b'));
        
        // New Game button
        document.getElementById('newGameBtn').addEventListener('click', startNewGame);
        
        // End Turn button
        document.getElementById('endTurnBtn').addEventListener('click', endTurn);
        
        // Close modal when clicking outside
        document.getElementById('cardModal').addEventListener('click', (e) => {
            if (e.target.id === 'cardModal') {
                closeCardModal();
            }
        });
        
        // Discard pile click to view
        document.getElementById('discardPile').addEventListener('click', viewDiscardCard);
        
        // Pawn promotion event listeners
        document.getElementById('promoteQueen').addEventListener('click', () => handlePromotion('q'));
        document.getElementById('promoteRook').addEventListener('click', () => handlePromotion('r'));
        document.getElementById('promoteBishop').addEventListener('click', () => handlePromotion('b'));
        document.getElementById('promoteKnight').addEventListener('click', () => handlePromotion('n'));
        
        // Start game immediately with white
        initGame();
    </script>
</body>
