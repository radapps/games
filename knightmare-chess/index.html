<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Knightmare Chess</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cinzel:wght@400;600&family=Crimson+Pro:ital,wght@0,300;0,400;1,400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chess.js@0.10.3/chess.js"></script>
<style>
:root {
  --bg: #0d0d18;
  --panel: #12122a;
  --panel2: #1a1a3a;
  --gold: #c9a84c;
  --gold2: #e8c870;
  --gold-dim: #7a6230;
  --crimson: #8b1a1a;
  --crimson2: #b52020;
  --white-sq: #e8d5b0;
  --black-sq: #7a5c38;
  --selected: rgba(255,220,50,0.45);
  --valid-move: rgba(100,220,100,0.35);
  --last-move: rgba(200,180,50,0.3);
  --check: rgba(220,50,50,0.5);
  --card-bg: #1e1230;
  --card-border: #4a3060;
  --text: #d4c9a8;
  --text-dim: #7a7060;
  --shadow: 0 4px 24px rgba(0,0,0,0.6);
  --radius: 8px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Crimson Pro', serif; overflow-x: hidden; }

body { 
  background-image: 
    radial-gradient(ellipse at 20% 10%, rgba(100,50,200,0.08) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 90%, rgba(180,50,50,0.07) 0%, transparent 50%);
  min-height: 100vh;
}

/* ===== HEADER ===== */
#header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 16px; border-bottom: 1px solid var(--gold-dim);
  background: rgba(0,0,0,0.4); position: sticky; top: 0; z-index: 100;
}
#header h1 { 
  font-family: 'Cinzel Decorative', serif; font-size: clamp(14px,3vw,22px); 
  color: var(--gold2); letter-spacing: 2px; text-shadow: 0 0 20px rgba(200,160,50,0.4);
}
#turn-indicator {
  font-family: 'Cinzel', serif; font-size: 13px; padding: 5px 12px;
  border-radius: 20px; border: 1px solid var(--gold-dim);
  background: var(--panel); color: var(--gold);
}
#turn-indicator.cpu-turn { border-color: var(--crimson); color: #ff6060; }
#btn-new-game {
  font-family: 'Cinzel', serif; font-size: 11px; padding: 6px 12px;
  background: transparent; border: 1px solid var(--gold-dim); color: var(--gold);
  border-radius: var(--radius); cursor: pointer; transition: all 0.2s;
}
#btn-new-game:hover { background: var(--gold-dim); color: #fff; }

/* ===== MAIN LAYOUT ===== */
#game-layout {
  display: grid;
  grid-template-columns: 160px 1fr 160px;
  gap: 10px; padding: 10px;
  max-width: 1000px; margin: 0 auto;
}
#effects-panel { grid-column: 1; grid-row: 1; }
#board-area { grid-column: 2; grid-row: 1; display: flex; flex-direction: column; align-items: center; gap: 8px; }
#deck-area { grid-column: 3; grid-row: 1; display: flex; flex-direction: column; gap: 10px; }

/* Mobile layout */
@media (max-width: 768px) {
  #game-layout {
    grid-template-columns: 1fr;
    grid-template-rows: auto auto auto;
    gap: 8px;
  }
  #effects-panel { grid-column: 1; grid-row: 3; }
  #board-area { grid-column: 1; grid-row: 1; }
  #deck-area { 
    grid-column: 1; grid-row: 2; 
    flex-direction: row; justify-content: center;
  }
  #deck-panel, #discard-panel { flex: 0 0 120px; }
}

/* ===== PANELS ===== */
.panel {
  background: var(--panel); border: 1px solid rgba(201,168,76,0.25);
  border-radius: var(--radius); padding: 8px; position: relative;
}
.panel-title {
  font-family: 'Cinzel', serif; font-size: 10px; color: var(--gold);
  text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 8px;
  text-align: center; border-bottom: 1px solid rgba(201,168,76,0.2); padding-bottom: 5px;
}

/* ===== EFFECTS PANEL ===== */
#effects-panel { min-height: 200px; }
#active-effects { display: flex; flex-direction: column; gap: 6px; }
.effect-card-mini {
  background: linear-gradient(135deg, var(--panel2) 0%, #1a1040 100%);
  border: 1px solid var(--gold-dim);
  border-radius: 6px; padding: 6px; cursor: pointer;
  font-size: 11px; transition: all 0.2s;
  box-shadow: 0 2px 8px rgba(0,0,0,0.3);
}
.effect-card-mini:hover { 
  border-color: var(--gold); 
  transform: translateY(-2px);
  box-shadow: 0 4px 12px rgba(201,168,76,0.3);
}
.effect-card-mini .ecm-name { 
  font-family: 'Cinzel', serif; font-size: 10px; 
  color: var(--gold); margin-bottom: 2px; 
  display: flex; justify-content: space-between;
}
.effect-card-mini .ecm-owner { font-size: 9px; color: var(--text-dim); margin-bottom: 3px; }
.effect-card-mini .ecm-effect { font-size: 10px; line-height: 1.3; }
.effect-duration { font-size: 9px; color: var(--gold2); font-weight: bold; }
.no-effects { font-size: 11px; color: var(--text-dim); text-align: center; padding: 10px; font-style: italic; }

/* ===== DECK & DISCARD ===== */
#deck-panel, #discard-panel { }
#deck-stack, #discard-stack {
  width: 100%; aspect-ratio: 5/7; position: relative;
  border-radius: var(--radius); overflow: hidden; display: flex;
  align-items: center; justify-content: center; min-height: 100px;
}
#deck-stack {
  background: linear-gradient(135deg, #1a0a3a 0%, #2a1060 100%);
  border: 2px solid var(--gold-dim); transition: all 0.2s;
  box-shadow: var(--shadow);
  cursor: pointer;
}
#deck-stack:hover { 
  border-color: var(--gold);
  transform: translateY(-2px);
  box-shadow: 0 6px 28px rgba(0,0,0,0.7);
}
.deck-pattern {
  position: absolute; inset: 4px; border: 1px solid rgba(201,168,76,0.3);
  border-radius: 4px;
  background-image: repeating-linear-gradient(
    45deg, transparent, transparent 4px, rgba(201,168,76,0.05) 4px, rgba(201,168,76,0.05) 8px
  );
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
}
.deck-icon { font-size: 28px; }
#deck-count { font-family: 'Cinzel', serif; font-size: 11px; color: var(--gold); }
#discard-stack {
  background: var(--panel2); border: 1px dashed rgba(201,168,76,0.3);
  min-height: 80px;
}
.discard-preview {
  width: 100%; height: 100%;
  background: linear-gradient(135deg, var(--card-bg) 0%, #2a1550 100%);
  border: 1px solid var(--card-border);
  border-radius: 4px; padding: 4px;
  display: flex; flex-direction: column; justify-content: space-between;
  font-size: 9px;
}
.discard-preview .card-name {
  font-family: 'Cinzel', serif; color: var(--gold); font-size: 8px;
  text-align: center; margin-bottom: 2px;
}
.discard-preview .card-type {
  font-size: 7px; color: var(--text-dim); text-align: center;
}
.discard-label { font-size: 11px; color: var(--text-dim); font-style: italic; text-align: center; }

/* ===== BOARD AREA ===== */
#captured-cpu, #captured-player {
  display: flex; flex-wrap: wrap; gap: 2px; width: 100%; min-height: 22px;
  padding: 3px; background: rgba(0,0,0,0.2); border-radius: 4px;
  justify-content: center;
}
.captured-piece { font-size: 18px; opacity: 0.6; line-height: 1; }

#board-wrapper {
  position: relative; 
  width: min(calc(100vw - 360px), 480px);
  aspect-ratio: 1/1;
}
@media (max-width: 768px) {
  #board-wrapper {
    width: min(calc(100vw - 20px), 480px);
  }
}
#board-container {
  width: 100%; height: 100%;
  border: 3px solid var(--gold-dim);
  border-radius: 4px; overflow: hidden;
  box-shadow: 0 0 40px rgba(0,0,0,0.8), 0 0 80px rgba(100,50,200,0.1);
}
#chess-board { 
  display: grid; grid-template-columns: repeat(8, 1fr);
  width: 100%; height: 100%;
}
.sq {
  position: relative; display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: background-color 0.15s;
  aspect-ratio: 1;
}
.sq.light { background: var(--white-sq); }
.sq.dark { background: var(--black-sq); }
.sq.selected { background: var(--selected) !important; }
.sq.valid-move::after {
  content: ''; position: absolute; width: 30%; height: 30%;
  border-radius: 50%; background: rgba(80,180,80,0.6);
}
.sq.valid-capture { background: rgba(220,80,80,0.35) !important; }
.sq.last-from, .sq.last-to { background: var(--last-move) !important; }
.sq.in-check { background: var(--check) !important; }
.sq.highlight-card { background: rgba(100,150,255,0.4) !important; }
.sq-piece { 
  font-size: clamp(20px, 4.5vw, 40px); line-height: 1;
  cursor: pointer; user-select: none; 
  transition: transform 0.1s;
  text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
  position: relative; z-index: 1;
}
.sq-piece:hover { transform: scale(1.1); }
.piece-marker {
  position: absolute; top: 2px; left: 2px; width: 8px; height: 8px;
  border-radius: 50%; border: 1px solid rgba(255,255,255,0.8); z-index: 2;
}
.piece-marker.protected { background: rgba(100,180,255,0.6); }
.piece-marker.amazon { background: rgba(200,100,255,0.8); }

/* ===== STATUS / LOG ===== */
#game-status {
  font-family: 'Cinzel', serif; font-size: 13px; color: var(--gold2);
  text-align: center; min-height: 20px; padding: 4px;
  text-shadow: 0 0 10px rgba(200,160,50,0.3);
}
#game-log {
  width: 100%; max-height: 80px; overflow-y: auto;
  background: rgba(0,0,0,0.3); border-radius: 4px;
  padding: 6px; font-size: 11px; color: var(--text-dim);
}
#game-log .log-entry { margin-bottom: 2px; line-height: 1.4; }
.log-move { color: var(--gold2); }
.log-card { color: #9090ff; }
.log-sys { color: var(--text-dim); }

/* ===== PLAYER HAND ===== */
#player-hand-container {
  width: 100%; padding: 8px; background: rgba(0,0,0,0.3);
  border-radius: var(--radius); min-height: 100px;
}
#player-hand {
  display: flex; gap: 8px; overflow-x: auto; padding: 4px;
  justify-content: center; flex-wrap: wrap;
}
.card {
  width: 80px; flex-shrink: 0;
  aspect-ratio: 5/7; position: relative;
  background: linear-gradient(135deg, var(--card-bg) 0%, #2a1550 100%);
  border: 2px solid var(--card-border);
  border-radius: 6px; padding: 6px;
  cursor: pointer; transition: all 0.2s;
  box-shadow: 0 2px 8px rgba(0,0,0,0.4);
  display: flex; flex-direction: column; justify-content: space-between;
}
.card:hover {
  transform: translateY(-4px) scale(1.05);
  border-color: var(--gold);
  box-shadow: 0 6px 20px rgba(201,168,76,0.4);
  z-index: 10;
}
.card.selected {
  border-color: var(--gold2);
  box-shadow: 0 0 20px rgba(201,168,76,0.6);
  transform: translateY(-8px) scale(1.08);
}
.card.disabled {
  opacity: 0.4;
  cursor: not-allowed;
}
.card.disabled:hover {
  transform: none;
  border-color: var(--card-border);
  box-shadow: 0 2px 8px rgba(0,0,0,0.4);
}
.card-header {
  text-align: center;
}
.card-name {
  font-family: 'Cinzel', serif; font-size: 9px;
  color: var(--gold); margin-bottom: 2px;
  line-height: 1.2;
}
.card-type {
  font-size: 7px; color: var(--text-dim);
  text-transform: uppercase; letter-spacing: 0.5px;
}
.card-icon {
  font-size: 24px; text-align: center;
  margin: 4px 0;
}
.card-effect {
  font-size: 8px; line-height: 1.3;
  color: var(--text);
  text-align: center;
}

/* ===== ACTION BUTTONS ===== */
#action-buttons {
  display: flex; gap: 8px; justify-content: center;
  margin-top: 8px;
}
.action-btn {
  font-family: 'Cinzel', serif; font-size: 11px; padding: 8px 16px;
  background: var(--panel); border: 1px solid var(--gold-dim);
  color: var(--gold); border-radius: var(--radius);
  cursor: pointer; transition: all 0.2s;
}
.action-btn:hover {
  background: var(--gold-dim); color: #fff;
  box-shadow: 0 2px 12px rgba(201,168,76,0.3);
}
.action-btn:disabled {
  opacity: 0.3; cursor: not-allowed;
}

/* ===== MODAL/DIALOG ===== */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.8);
  display: none; align-items: center; justify-content: center;
  z-index: 1000; backdrop-filter: blur(4px);
}
.modal-overlay.show { display: flex; }
.modal-content {
  background: var(--panel); border: 2px solid var(--gold-dim);
  border-radius: var(--radius); padding: 20px;
  max-width: 90%; box-shadow: 0 8px 32px rgba(0,0,0,0.9);
}
.modal-title {
  font-family: 'Cinzel Decorative', serif; font-size: 18px;
  color: var(--gold2); text-align: center; margin-bottom: 16px;
}
#promotion-choices {
  display: flex; gap: 12px; justify-content: center;
}
.promo-choice {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  padding: 12px; background: var(--panel2); border: 2px solid var(--gold-dim);
  border-radius: var(--radius); cursor: pointer; transition: all 0.2s;
}
.promo-choice:hover {
  border-color: var(--gold); transform: scale(1.1);
  box-shadow: 0 4px 16px rgba(201,168,76,0.4);
}
.promo-label {
  font-family: 'Cinzel', serif; font-size: 12px; color: var(--text);
}

/* Card detail modal */
#card-detail-modal .modal-content {
  max-width: 400px;
}
.card-detail-large {
  background: linear-gradient(135deg, var(--card-bg) 0%, #2a1550 100%);
  border: 2px solid var(--gold);
  border-radius: 8px; padding: 16px;
  text-align: center;
}
.card-detail-large .card-name {
  font-family: 'Cinzel Decorative', serif;
  font-size: 18px; color: var(--gold2);
  margin-bottom: 8px;
}
.card-detail-large .card-type {
  font-size: 11px; color: var(--text-dim);
  margin-bottom: 12px;
}
.card-detail-large .card-icon {
  font-size: 48px; margin: 12px 0;
}
.card-detail-large .card-effect {
  font-size: 13px; line-height: 1.5;
  color: var(--text); margin: 12px 0;
}
.card-detail-flavor {
  font-size: 11px; font-style: italic;
  color: var(--text-dim); margin-top: 12px;
  border-top: 1px solid rgba(201,168,76,0.2);
  padding-top: 12px;
}

/* Scrollbar styling */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
::-webkit-scrollbar-thumb { background: var(--gold-dim); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--gold); }
</style>
</head>
<body>

<div id="header">
  <h1>⚔ KNIGHTMARE CHESS ⚔</h1>
  <div id="turn-indicator">Your Turn</div>
  <button id="btn-new-game" onclick="initGame()">New Game</button>
</div>

<div id="game-layout">
  <!-- Left: Continuing Effects -->
  <div id="effects-panel" class="panel">
    <div class="panel-title">⚡ Active Effects</div>
    <div id="active-effects">
      <div class="no-effects">No active effects</div>
    </div>
  </div>

  <!-- Center: Board -->
  <div id="board-area">
    <div id="captured-cpu"></div>
    
    <div id="board-wrapper">
      <div id="board-container">
        <div id="chess-board"></div>
      </div>
    </div>

    <div id="captured-player"></div>
    
    <div id="game-status">Select a piece to move</div>
    <div id="game-log"></div>

    <div id="player-hand-container">
      <div id="player-hand"></div>
    </div>

    <div id="action-buttons">
      <button id="btn-end-turn" class="action-btn" style="display:none" onclick="endPlayerTurn()">End Turn</button>
      <button id="btn-cancel" class="action-btn" style="display:none" onclick="cancelCardPlay()">Cancel</button>
    </div>
  </div>

  <!-- Right: Deck & Discard -->
  <div id="deck-area">
    <div id="deck-panel" class="panel">
      <div class="panel-title">🃏 Deck</div>
      <div id="deck-stack" onclick="onDeckClick()">
        <div class="deck-pattern">
          <div class="deck-icon">🎴</div>
          <div id="deck-count">52 cards</div>
        </div>
      </div>
    </div>

    <div id="discard-panel" class="panel">
      <div class="panel-title">🗑 Discard</div>
      <div id="discard-stack">
        <div class="discard-label">Empty</div>
      </div>
    </div>
  </div>
</div>

<!-- Promotion Dialog -->
<div id="promotion-dialog" class="modal-overlay">
  <div class="modal-content">
    <div class="modal-title">Choose Promotion</div>
    <div id="promotion-choices"></div>
  </div>
</div>

<!-- Card Detail Modal -->
<div id="card-detail-modal" class="modal-overlay" onclick="closeCardDetail()">
  <div class="modal-content" onclick="event.stopPropagation()">
    <div id="card-detail-content"></div>
  </div>
</div>

<script>
// ===================================================================
//  GAME STATE
// ===================================================================
const game = new Chess();
const gameState = {
  phase: 'player_pre', // player_pre, player_move, player_after, cpu_thinking, game_over
  selectedSquare: null,
  validMoves: [],
  lastFrom: null,
  lastTo: null,
  capturedByPlayer: [],
  capturedByCpu: [],
  
  // Card system
  deck: [],
  discard: [],
  playerHand: [],
  cpuHand: [],
  activeEffects: [],
  selectedCardIdx: null,
  boardSelMode: false,
  boardSelCard: null,
  boardSelTargets: [],
  
  // Custom pieces
  customPieces: {}, // square -> {type: 'amazon', moves: [...]}
};

const PIECE_UNICODE = {
  'K': '♔', 'Q': '♕', 'R': '♖', 'B': '♗', 'N': '♘', 'P': '♙',
  'k': '♚', 'q': '♛', 'r': '♜', 'b': '♝', 'n': '♞', 'p': '♟'
};

const PIECE_NAMES = {
  'K': 'King', 'Q': 'Queen', 'R': 'Rook', 'B': 'Bishop', 'N': 'Knight', 'P': 'Pawn'
};

// ===================================================================
//  CARD DEFINITIONS
// ===================================================================
const CARD_LIBRARY = [
  // Movement cards
  {
    id: 'teleport',
    name: 'Teleport',
    icon: '🌀',
    type: 'Instant',
    timing: 'instead_of_move',
    playType: 'board_select',
    selectType: 'piece_then_empty',
    effect: 'Move one of your pieces to any empty square.',
    flavor: 'Space bends to your will.'
  },
  {
    id: 'knight_leap',
    name: "Knight's Leap",
    icon: '🐴',
    type: 'Instant',
    timing: 'instead_of_move',
    playType: 'board_select',
    selectType: 'piece_then_knight',
    effect: 'Move one of your pieces with a knight move.',
    flavor: 'The horse gallops across dimensions.'
  },
  {
    id: 'swap',
    name: 'Swap Positions',
    icon: '⇄',
    type: 'Instant',
    timing: 'instead_of_move',
    playType: 'board_select',
    selectType: 'two_own_pieces',
    effect: 'Swap the positions of two of your pieces.',
    flavor: 'Reality shifts in a blink.'
  },
  {
    id: 'royal_step',
    name: 'Royal Step',
    icon: '👑',
    type: 'Instant',
    timing: 'instead_of_move',
    playType: 'board_select',
    selectType: 'piece_then_adjacent',
    effect: 'Move one of your pieces one square in any direction.',
    flavor: 'Even pawns can walk like kings.'
  },
  
  // Piece transformation
  {
    id: 'amazon',
    name: 'Amazon Ascension',
    icon: '⚜️',
    type: 'Enchantment',
    timing: 'before_self',
    playType: 'board_select',
    selectType: 'own_piece',
    duration: 3,
    effect: 'Choose one of your pieces. It gains Queen + Knight moves for 3 turns.',
    flavor: 'The ultimate warrior-queen emerges.'
  },
  {
    id: 'promote_minor',
    name: 'Battlefield Promotion',
    icon: '⬆️',
    type: 'Instant',
    timing: 'before_self',
    playType: 'board_select',
    selectType: 'own_bishop_knight',
    effect: 'Upgrade a Bishop or Knight to a Queen.',
    flavor: 'Valor deserves reward.'
  },
  
  // Protection/Defense
  {
    id: 'shield',
    name: 'Sacred Shield',
    icon: '🛡️',
    type: 'Enchantment',
    timing: 'before_self',
    playType: 'board_select',
    selectType: 'own_piece',
    duration: 2,
    effect: 'Choose one of your pieces. It cannot be captured for 2 turns.',
    flavor: 'Divine protection surrounds the chosen.'
  },
  {
    id: 'fortress',
    name: 'Fortress',
    icon: '🏰',
    type: 'Enchantment',
    timing: 'after_self',
    playType: 'auto',
    duration: 1,
    effect: 'Your pieces cannot be captured until your next turn.',
    flavor: 'Walls rise from the earth.'
  },
  
  // Offensive
  {
    id: 'capture_any',
    name: 'Assassination',
    icon: '🗡️',
    type: 'Instant',
    timing: 'instead_of_move',
    playType: 'board_select',
    selectType: 'enemy_piece',
    effect: 'Remove any opponent piece (except the King).',
    flavor: 'One strike. One kill.'
  },
  {
    id: 'double_move',
    name: 'Haste',
    icon: '⚡',
    type: 'Instant',
    timing: 'after_self',
    playType: 'manual',
    effect: 'Make one additional move this turn.',
    flavor: 'Time bends to your command.'
  },
  
  // Control
  {
    id: 'freeze',
    name: 'Freeze',

// ===================================================================
//  INITIALIZATION
// ===================================================================
function initGame() {
  game.reset();
  gameState.phase = 'player_pre';
  gameState.selectedSquare = null;
  gameState.validMoves = [];
  gameState.lastFrom = null;
  gameState.lastTo = null;
  gameState.capturedByPlayer = [];
  gameState.capturedByCpu = [];
  gameState.customPieces = {};
  gameState.activeEffects = [];
  gameState.selectedCardIdx = null;
  gameState.boardSelMode = false;
  
  // Initialize deck
  gameState.deck = createDeck();
  shuffleDeck();
  gameState.discard = [];
  
  // Deal starting hands
  gameState.playerHand = [];
  gameState.cpuHand = [];
  for (let i = 0; i < 5; i++) {
    playerDrawCard();
    cpuDrawCard();
  }
  
  renderBoard();
  renderPlayerHand();
  updateDeckDisplay();
  updateDiscardDisplay();
  updateEffectsPanel();
  setStatus('Your turn — select a piece or play a card');
  document.getElementById('turn-indicator').textContent = 'Your Turn';
  document.getElementById('turn-indicator').classList.remove('cpu-turn');
}

function createDeck() {
  const deck = [];
  // Add multiple copies of each card
  CARD_LIBRARY.forEach(card => {
    const copies = card.id === 'amazon' || card.id === 'capture_any' ? 2 : 
                   card.id === 'teleport' || card.id === 'freeze' ? 4 : 3;
    for (let i = 0; i < copies; i++) {
      deck.push({...card});
    }
  });
  return deck;
}

function shuffleDeck() {
  for (let i = gameState.deck.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [gameState.deck[i], gameState.deck[j]] = [gameState.deck[j], gameState.deck[i]];
  }
}

function playerDrawCard() {
  if (gameState.deck.length === 0) {
    if (gameState.discard.length === 0) return;
    gameState.deck = [...gameState.discard];
    gameState.discard = [];
    shuffleDeck();
    updateDiscardDisplay();
  }
  
  if (gameState.deck.length > 0 && gameState.playerHand.length < 7) {
    const card = gameState.deck.pop();
    gameState.playerHand.push(card);
    renderPlayerHand();
    updateDeckDisplay();
    addLog(`Drew: ${card.name}`, 'log-card');
  }
}

function cpuDrawCard() {
  if (gameState.deck.length === 0) {
    if (gameState.discard.length === 0) return;
    gameState.deck = [...gameState.discard];
    gameState.discard = [];
    shuffleDeck();
    updateDiscardDisplay();
  }
  
  if (gameState.deck.length > 0 && gameState.cpuHand.length < 7) {
    const card = gameState.deck.pop();
    gameState.cpuHand.push(card);
    updateDeckDisplay();
  }
}

// ===================================================================
//  RENDERING
// ===================================================================
function renderBoard() {
  const board = document.getElementById('chess-board');
  board.innerHTML = '';
  
  for (let row = 7; row >= 0; row--) {
    for (let col = 0; col < 8; col++) {
      const square = String.fromCharCode(97 + col) + (row + 1);
      const piece = game.get(square);
      
      const sq = document.createElement('div');
      sq.className = 'sq';
      sq.dataset.square = square;
      sq.classList.add((row + col) % 2 === 0 ? 'light' : 'dark');
      
      // Highlights
      if (gameState.selectedSquare === square) sq.classList.add('selected');
      if (gameState.validMoves.includes(square)) {
        sq.classList.add(piece ? 'valid-capture' : 'valid-move');
      }
      if (gameState.lastFrom === square) sq.classList.add('last-from');
      if (gameState.lastTo === square) sq.classList.add('last-to');
      if (game.in_check() && piece && piece.type === 'k') sq.classList.add('in-check');
      
      // Board selection highlights
      if (gameState.boardSelMode && gameState.boardSelTargets.includes(square)) {
        sq.classList.add('highlight-card');
      }
      
      // Piece
      if (piece) {
        const pieceEl = document.createElement('div');
        pieceEl.className = 'sq-piece';
        const unicode = PIECE_UNICODE[piece.color === 'w' ? piece.type.toUpperCase() : piece.type];
        pieceEl.textContent = unicode;
        sq.appendChild(pieceEl);
        
        // Custom piece markers
        const custom = gameState.customPieces[square];
        if (custom) {
          const marker = document.createElement('div');
          marker.className = `piece-marker ${custom.type}`;
          sq.appendChild(marker);
        }
        
        // Protected marker
        const protected = gameState.activeEffects.find(e => 
          e.type === 'protected' && e.target === square
        );
        if (protected) {
          const marker = document.createElement('div');
          marker.className = 'piece-marker protected';
          sq.appendChild(marker);
        }
      }
      
      sq.onclick = () => onSquareClick(square);
      board.appendChild(sq);
    }
  }
  
  updateCaptured();
}

function updateCaptured() {
  const cpuEl = document.getElementById('captured-cpu');
  const playerEl = document.getElementById('captured-player');
  
  cpuEl.innerHTML = gameState.capturedByCpu.map(p => {
    const unicode = PIECE_UNICODE[p.color === 'w' ? p.type.toUpperCase() : p.type];
    return `<span class="captured-piece">${unicode}</span>`;
  }).join('');
  
  playerEl.innerHTML = gameState.capturedByPlayer.map(p => {
    const unicode = PIECE_UNICODE[p.color === 'w' ? p.type.toUpperCase() : p.type];
    return `<span class="captured-piece">${unicode}</span>`;
  }).join('');
}

function renderPlayerHand() {
  const hand = document.getElementById('player-hand');
  hand.innerHTML = gameState.playerHand.map((card, idx) => {
    const playable = isCardPlayableNow(card);
    const selected = idx === gameState.selectedCardIdx;
    
    return `
      <div class="card ${selected ? 'selected' : ''} ${!playable ? 'disabled' : ''}" 
           onclick="onCardClick(${idx})"
           oncontextmenu="showCardDetail(${idx}); return false;">
        <div class="card-header">
          <div class="card-name">${card.name}</div>
          <div class="card-type">${card.type}</div>
        </div>
        <div class="card-icon">${card.icon}</div>
        <div class="card-effect">${card.effect}</div>
      </div>
    `;
  }).join('');
}

function updateDeckDisplay() {
  document.getElementById('deck-count').textContent = `${gameState.deck.length} cards`;
}

function updateDiscardDisplay() {
  const stack = document.getElementById('discard-stack');
  if (gameState.discard.length === 0) {
    stack.innerHTML = '<div class="discard-label">Empty</div>';
  } else {
    const topCard = gameState.discard[gameState.discard.length - 1];
    stack.innerHTML = `
      <div class="discard-preview">
        <div class="card-name">${topCard.name}</div>
        <div class="card-icon" style="font-size:16px">${topCard.icon}</div>
        <div class="card-type">${topCard.type}</div>
      </div>
    `;
  }
}

function updateEffectsPanel() {
  const panel = document.getElementById('active-effects');
  if (gameState.activeEffects.length === 0) {
    panel.innerHTML = '<div class="no-effects">No active effects</div>';
    return;
  }
  
  panel.innerHTML = gameState.activeEffects.map((effect, idx) => `
    <div class="effect-card-mini" onclick="showEffectDetail(${idx})">
      <div class="ecm-name">
        <span>${effect.name}</span>
        ${effect.turnsLeft ? `<span class="effect-duration">${effect.turnsLeft}⏱</span>` : ''}
      </div>
      <div class="ecm-owner">${effect.owner === 'player' ? 'Your' : 'CPU'} effect</div>
      <div class="ecm-effect">${effect.description}</div>
    </div>
  `).join('');
}

// ===================================================================
//  CARD PLAYABILITY & SELECTION
// ===================================================================
function isCardPlayableNow(card) {
  if (gameState.phase === 'game_over' || gameState.phase === 'cpu_thinking') return false;
  
  if (card.timing === 'any') return true;
  if (card.timing === 'before_self' && gameState.phase === 'player_pre') return true;
  if (card.timing === 'after_self' && gameState.phase === 'player_after') return true;
  if (card.timing === 'instead_of_move' && 
      (gameState.phase === 'player_pre' || gameState.phase === 'player_move')) return true;
  
  return false;
}

function onCardClick(idx) {
  const card = gameState.playerHand[idx];
  if (!isCardPlayableNow(card)) return;
  
  if (gameState.selectedCardIdx === idx) {
    // Deselect
    gameState.selectedCardIdx = null;
    cancelBoardSel();
    renderPlayerHand();
    return;
  }
  
  gameState.selectedCardIdx = idx;
  
  if (card.playType === 'auto') {
    playCard(idx, 'player');
  } else if (card.playType === 'manual') {
    playCard(idx, 'player');
    setStatus(`${card.name}: ${card.effect}`);
  } else if (card.playType === 'board_select') {
    startBoardSelect(card, idx);
  }
  
  renderPlayerHand();
}

function playCard(idx, owner) {
  const card = owner === 'player' ? gameState.playerHand[idx] : gameState.cpuHand[idx];
  
  // Remove from hand
  if (owner === 'player') {
    gameState.playerHand.splice(idx, 1);
  } else {
    gameState.cpuHand.splice(idx, 1);
  }
  
  // Add to discard
  gameState.discard.push(card);
  updateDiscardDisplay();
  
  addLog(`${owner === 'player' ? 'You' : 'CPU'} played: ${card.name}`, 'log-card');
  
  // Apply effect based on type
  applyCardEffect(card, owner);
  
  renderPlayerHand();
}

function applyCardEffect(card, owner) {
  switch(card.id) {
    case 'freeze':
      // Skip opponent's next turn
      addLog('Opponent frozen!', 'log-sys');
      // This would be handled in turn logic
      break;
      
    case 'fortress':
      gameState.activeEffects.push({
        name: card.name,
        type: 'fortress',
        owner: owner,
        description: 'Pieces cannot be captured',
        turnsLeft: card.duration
      });
      updateEffectsPanel();
      break;
      
    case 'see_hand':
      if (owner === 'player') {
        showCpuHand();
      }
      break;
      
    // Board select cards are handled by their selection logic
  }
}

// ===================================================================
//  BOARD SELECTION
// ===================================================================
function startBoardSelect(card, idx) {
  gameState.boardSelMode = true;
  gameState.boardSelCard = card;
  gameState.boardSelIdx = idx;
  gameState.boardSelTargets = [];
  gameState.boardSelStep = 0;
  
  highlightValidTargets(card, 0);
  setStatus(`${card.name}: Select target...`);
  document.getElementById('btn-cancel').style.display = '';
}

function highlightValidTargets(card, step) {
  gameState.boardSelTargets = [];
  
  const selectType = card.selectType.split('_then_');
  const currentSelect = selectType[step] || selectType[0];
  
  for (let row = 0; row < 8; row++) {
    for (let col = 0; col < 8; col++) {
      const square = String.fromCharCode(97 + col) + (row + 1);
      const piece = game.get(square);
      
      let valid = false;
      
      switch(currentSelect) {
        case 'piece':
        case 'own':
          valid = piece && piece.color === 'w';
          break;
        case 'empty':
          valid = !piece;
          break;
        case 'enemy':
          valid = piece && piece.color === 'b' && piece.type !== 'k';
          break;
        case 'bishop':
        case 'knight':
          valid = piece && piece.color === 'w' && 
                 (piece.type === 'b' || piece.type === 'n');
          break;
      }
      
      if (valid) {
        gameState.boardSelTargets.push(square);
      }
    }
  }
  
  renderBoard();
}

function onBoardSelectClick(square) {
  if (!gameState.boardSelTargets.includes(square)) return;
  
  const card = gameState.boardSelCard;
  const selectType = card.selectType.split('_then_');
  
  if (!gameState.selectedSquares) {
    gameState.selectedSquares = [];
  }
  
  gameState.selectedSquares.push(square);
  gameState.boardSelStep++;
  
  if (gameState.boardSelStep >= selectType.length) {
    // Execute card effect
    executeCardEffect(card, gameState.selectedSquares);
    cancelBoardSel();
    playCard(gameState.boardSelIdx, 'player');
    
    // Draw a card
    playerDrawCard();
    
    // Check if replaced move
    if (card.timing === 'instead_of_move') {
      endPlayerTurn();
    }
  } else {
    highlightValidTargets(card, gameState.boardSelStep);
  }
}

function executeCardEffect(card, targets) {
  switch(card.id) {
    case 'teleport':
      // Move piece to empty square
      const from = targets[0];
      const to = targets[1];
      const piece = game.get(from);
      game.remove(from);
      game.put(piece, to);
      addLog(`Teleported ${PIECE_NAMES[piece.type.toUpperCase()]} to ${to}`, 'log-sys');
      break;
      
    case 'swap':
      // Swap two pieces
      const sq1 = targets[0];
      const sq2 = targets[1];
      const p1 = game.get(sq1);
      const p2 = game.get(sq2);
      game.remove(sq1);
      game.remove(sq2);
      if (p1) game.put(p1, sq2);
      if (p2) game.put(p2, sq1);
      addLog(`Swapped pieces at ${sq1} and ${sq2}`, 'log-sys');
      break;
      
    case 'amazon':
      // Add Amazon effect
      gameState.customPieces[targets[0]] = {type: 'amazon', moves: []};
      gameState.activeEffects.push({
        name: card.name,
        type: 'amazon',
        owner: 'player',
        target: targets[0],
        description: `${targets[0]} has Queen+Knight moves`,
        turnsLeft: card.duration
      });
      updateEffectsPanel();
      addLog(`${targets[0]} became an Amazon!`, 'log-sys');
      break;
      
    case 'shield':
      gameState.activeEffects.push({
        name: card.name,
        type: 'protected',
        owner: 'player',
        target: targets[0],
        description: `${targets[0]} cannot be captured`,
        turnsLeft: card.duration
      });
      updateEffectsPanel();
      addLog(`${targets[0]} is protected!`, 'log-sys');
      break;
      
    case 'promote_minor':
      const pPiece = game.get(targets[0]);
      game.remove(targets[0]);
      game.put({type: 'q', color: 'w'}, targets[0]);
      addLog(`Promoted ${targets[0]} to Queen!`, 'log-sys');
      break;
      
    case 'capture_any':
      const capturedPiece = game.get(targets[0]);
      game.remove(targets[0]);
      gameState.capturedByPlayer.push(capturedPiece);
      addLog(`Assassinated ${PIECE_NAMES[capturedPiece.type.toUpperCase()]} at ${targets[0]}!`, 'log-sys');
      break;
      
    case 'royal_step':
    case 'knight_leap':
      // Move piece
      const fromSq = targets[0];
      const toSq = targets[1];
      const movePiece = game.get(fromSq);
      game.remove(fromSq);
      game.put(movePiece, toSq);
      addLog(`Moved ${PIECE_NAMES[movePiece.type.toUpperCase()]} to ${toSq}`, 'log-sys');
      break;
  }
  
  renderBoard();
}

function cancelBoardSel() {
  gameState.boardSelMode = false;
  gameState.boardSelCard = null;
  gameState.boardSelTargets = [];
  gameState.selectedSquares = null;
  gameState.boardSelStep = 0;
  renderBoard();
  document.getElementById('btn-cancel').style.display = 'none';
}

function cancelCardPlay() {
  gameState.selectedCardIdx = null;
  cancelBoardSel();
  renderPlayerHand();
  setStatus('Card cancelled');
}

// ===================================================================
//  BOARD SQUARE CLICK
// ===================================================================
function onSquareClick(square) {
  if (gameState.phase === 'cpu_thinking' || gameState.phase === 'game_over') return;
  
  if (gameState.boardSelMode) {
    onBoardSelectClick(square);
    return;
  }
  
  if (gameState.phase !== 'player_pre' && gameState.phase !== 'player_move') return;
  
  const piece = game.get(square);
  
  if (!gameState.selectedSquare) {
    if (piece && piece.color === 'w') {
      gameState.selectedSquare = square;
      gameState.phase = 'player_move';
      
      // Get valid moves (including custom pieces)
      let moves = game.moves({square, verbose: true});
      
      // Add Amazon moves if applicable
      if (gameState.customPieces[square]?.type === 'amazon') {
        // Amazon = Queen + Knight moves
        // Add knight moves
        const knightOffsets = [
          [-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]
        ];
        const file = square.charCodeAt(0) - 97;
        const rank = parseInt(square[1]) - 1;
        
        knightOffsets.forEach(([df, dr]) => {
          const newFile = file + df;
          const newRank = rank + dr;
          if (newFile >= 0 && newFile < 8 && newRank >= 0 && newRank < 8) {
            const targetSq = String.fromCharCode(97 + newFile) + (newRank + 1);
            const targetPiece = game.get(targetSq);
            if (!targetPiece || targetPiece.color !== piece.color) {
              moves.push({to: targetSq});
            }
          }
        });
      }
      
      gameState.validMoves = moves.map(m => m.to);
      renderBoard();
      setStatus(`Selected ${PIECE_NAMES[piece.type.toUpperCase()]} at ${square}`);
    }
  } else {
    if (square === gameState.selectedSquare) {
      gameState.selectedSquare = null;
      gameState.validMoves = [];
      gameState.phase = 'player_pre';
      renderBoard();
      setStatus('Your turn');
      return;
    }
    
    if (piece && piece.color === 'w') {
      gameState.selectedSquare = square;
      let moves = game.moves({square, verbose: true});
      gameState.validMoves = moves.map(m => m.to);
      renderBoard();
      setStatus(`Selected ${PIECE_NAMES[piece.type.toUpperCase()]} at ${square}`);
      return;
    }
    
    if (gameState.validMoves.includes(square)) {
      attemptPlayerMove(gameState.selectedSquare, square);
    } else {
      setStatus('Invalid move');
    }
  }
}

function attemptPlayerMove(from, to) {
  const piece = game.get(from);
  if (piece && piece.type === 'p' && piece.color === 'w' && to[1] === '8') {
    showPromotionDialog(from, to);
    return;
  }
  executePlayerMove(from, to, null);
}

function executePlayerMove(from, to, promotion) {
  const opts = {from, to};
  if (promotion) opts.promotion = promotion;
  
  const move = game.move(opts);
  if (!move) {
    setStatus('Invalid move');
    return;
  }
  
  gameState.lastFrom = from;
  gameState.lastTo = to;
  gameState.selectedSquare = null;
  gameState.validMoves = [];
  
  // Move custom piece marker if present
  if (gameState.customPieces[from]) {
    gameState.customPieces[to] = gameState.customPieces[from];
    delete gameState.customPieces[from];
  }
  
  addLog(`You moved: ${move.san}`, 'log-move');
  
  if (move.captured) {
    const capturedPiece = {type: move.captured, color: 'b'};
    gameState.capturedByPlayer.push(capturedPiece);
    addLog(`Captured: ${PIECE_NAMES[move.captured.toUpperCase()]}`, 'log-sys');
  }
  
  if (game.in_checkmate()) {
    renderBoard();
    endGame('You win! Checkmate!');
    return;
  }
  if (game.in_stalemate() || game.in_draw()) {
    renderBoard();
    endGame('Draw!');
    return;
  }
  
  renderBoard();
  gameState.phase = 'player_after';
  
  const hasAfterCards = gameState.playerHand.some(c => isCardPlayableNow(c));
  if (hasAfterCards) {
    setStatus('Move made — play a card or end turn');
    document.getElementById('btn-end-turn').style.display = '';
  } else {
    setTimeout(endPlayerTurn, 500);
  }
}

function endPlayerTurn() {
  document.getElementById('btn-end-turn').style.display = 'none';
  gameState.selectedCardIdx = null;
  cancelBoardSel();
  renderPlayerHand();
  
  // Tick down effect durations
  tickEffects('player');
  
  gameState.phase = 'cpu_thinking';
  setStatus('CPU is thinking…');
  document.getElementById('turn-indicator').textContent = 'CPU Turn';
  document.getElementById('turn-indicator').classList.add('cpu-turn');
  
  setTimeout(doCpuTurn, 800);
}

// ===================================================================
//  CPU TURN
// ===================================================================
async function doCpuTurn() {
  // Simple random move for now
  // In a full version, this would use Fairy-Stockfish
  
  const moves = game.moves({verbose: true});
  if (moves.length === 0) {
    if (game.in_checkmate()) {
      endGame('CPU wins! Checkmate!');
    } else {
      endGame('Draw!');
    }
    return;
  }
  
  // Pick a random move
  const move = moves[Math.floor(Math.random() * moves.length)];
  const result = game.move(move);
  
  gameState.lastFrom = move.from;
  gameState.lastTo = move.to;
  
  addLog(`CPU moved: ${result.san}`, 'log-move');
  
  if (result.captured) {
    const capturedPiece = {type: result.captured, color: 'w'};
    gameState.capturedByCpu.push(capturedPiece);
    addLog(`CPU captured: ${PIECE_NAMES[result.captured.toUpperCase()]}`, 'log-sys');
  }
  
  renderBoard();
  
  if (game.in_checkmate()) {
    endGame('CPU wins! Checkmate!');
    return;
  }
  if (game.in_stalemate() || game.in_draw()) {
    endGame('Draw!');
    return;
  }
  
  // CPU might play a card (simple AI)
  if (gameState.cpuHand.length > 0 && Math.random() < 0.3) {
    // Play a random playable card
    const playableCards = gameState.cpuHand.filter(c => c.timing === 'after_self' || c.timing === 'any');
    if (playableCards.length > 0) {
      const cardIdx = gameState.cpuHand.indexOf(playableCards[0]);
      setTimeout(() => {
        playCard(cardIdx, 'cpu');
        cpuDrawCard();
        setTimeout(startPlayerTurn, 500);
      }, 400);
      return;
    }
  }
  
  cpuDrawCard();
  tickEffects('cpu');
  
  setTimeout(startPlayerTurn, 600);
}

function startPlayerTurn() {
  gameState.phase = 'player_pre';
  setStatus('Your turn — select a piece or play a card');
  document.getElementById('turn-indicator').textContent = 'Your Turn';
  document.getElementById('turn-indicator').classList.remove('cpu-turn');
}

// ===================================================================
//  EFFECTS MANAGEMENT
// ===================================================================
function tickEffects(playerWhoJustMoved) {
  gameState.activeEffects = gameState.activeEffects.filter(effect => {
    if (effect.owner === playerWhoJustMoved && effect.turnsLeft) {
      effect.turnsLeft--;
      if (effect.turnsLeft <= 0) {
        addLog(`${effect.name} expired`, 'log-sys');
        
        // Remove custom pieces when effect expires
        if (effect.type === 'amazon' && effect.target) {
          delete gameState.customPieces[effect.target];
        }
        
        return false;
      }
    }
    return true;
  });
  
  updateEffectsPanel();
  renderBoard();
}

// ===================================================================
//  PROMOTION DIALOG
// ===================================================================
function showPromotionDialog(from, to) {
  const dialog = document.getElementById('promotion-dialog');
  const pieces = [
    {t:'q', s:'♕', n:'Queen'},
    {t:'r', s:'♖', n:'Rook'},
    {t:'b', s:'♗', n:'Bishop'},
    {t:'n', s:'♘', n:'Knight'}
  ];
  
  const ch = document.getElementById('promotion-choices');
  ch.innerHTML = pieces.map(p => `
    <div class="promo-choice" onclick="selectPromotion('${from}','${to}','${p.t}')">
      <span style="font-size:32px">${p.s}</span>
      <span class="promo-label">${p.n}</span>
    </div>
  `).join('');
  
  dialog.classList.add('show');
}

window.selectPromotion = function(from, to, piece) {
  document.getElementById('promotion-dialog').classList.remove('show');
  executePlayerMove(from, to, piece);
};

// ===================================================================
//  CARD DETAIL MODAL
// ===================================================================
function showCardDetail(idx) {
  const card = gameState.playerHand[idx];
  const content = document.getElementById('card-detail-content');
  
  content.innerHTML = `
    <div class="card-detail-large">
      <div class="card-name">${card.name}</div>
      <div class="card-type">${card.type}</div>
      <div class="card-icon">${card.icon}</div>
      <div class="card-effect">${card.effect}</div>
      <div class="card-detail-flavor">${card.flavor}</div>
    </div>
  `;
  
  document.getElementById('card-detail-modal').classList.add('show');
}

function showEffectDetail(idx) {
  const effect = gameState.activeEffects[idx];
  const content = document.getElementById('card-detail-content');
  
  content.innerHTML = `
    <div class="card-detail-large">
      <div class="card-name">${effect.name}</div>
      <div class="card-type">${effect.owner === 'player' ? 'Your' : 'CPU'} Effect</div>
      <div class="card-effect">${effect.description}</div>
      ${effect.turnsLeft ? `<div style="margin-top:12px; color: var(--gold2);">Turns remaining: ${effect.turnsLeft}</div>` : ''}
    </div>
  `;
  
  document.getElementById('card-detail-modal').classList.add('show');
}

function closeCardDetail() {
  document.getElementById('card-detail-modal').classList.remove('show');
}

function showCpuHand() {
  const content = document.getElementById('card-detail-content');
  content.innerHTML = `
    <div class="card-detail-large">
      <div class="card-name">CPU's Hand</div>
      <div class="card-type">Clairvoyance reveals:</div>
      <div style="margin-top:16px; display:flex; flex-wrap:wrap; gap:8px; justify-content:center;">
        ${gameState.cpuHand.map(card => `
          <div style="text-align:center;">
            <div style="font-size:24px;">${card.icon}</div>
            <div style="font-size:10px; color: var(--gold);">${card.name}</div>
          </div>
        `).join('')}
      </div>
    </div>
  `;
  document.getElementById('card-detail-modal').classList.add('show');
}

// ===================================================================
//  UTILITIES
// ===================================================================
function setStatus(msg) {
  document.getElementById('game-status').textContent = msg;
}

function addLog(msg, className = '') {
  const log = document.getElementById('game-log');
  const entry = document.createElement('div');
  entry.className = `log-entry ${className}`;
  entry.textContent = msg;
  log.appendChild(entry);
  log.scrollTop = log.scrollHeight;
}

function endGame(message) {
  gameState.phase = 'game_over';
  setStatus(message);
  setTimeout(() => alert(message), 300);
}

function onDeckClick() {
  // For debugging - show deck info
  setStatus(`Deck: ${gameState.deck.length} cards, Discard: ${gameState.discard.length} cards`);
}

// ===================================================================
//  START GAME
// ===================================================================
initGame();
</script>
